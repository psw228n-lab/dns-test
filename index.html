  <style>
    :root {
      /* 팀 컬러가 정해지면 아래 한 줄만 교체하세요. */
      --accent: #76545a;
      --accent-dark: #5c3e43;
      --ink: #25231f;
      --muted: #625e58;
      --line: #d9d4cc;
      --paper: #f3f0ea;
      --card: #fbfaf7;
      --white: #ffffff;
      --shadow: 0 12px 32px -20px rgba(30, 26, 22, 0.28);
      --ease: cubic-bezier(0.22, 0.72, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #e8e4de;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Malgun Gothic", sans-serif;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    button,
    a {
      font: inherit;
      touch-action: manipulation;
    }

    button {
      border: 0;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--paper);
    }

    @supports (min-height: 100dvh) {
      .app {
        min-height: 100dvh;
        height: 100dvh;
      }
    }

    .screen {
      min-height: inherit;
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 180ms ease, transform 220ms var(--ease);
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar {
      display: none;
    }

    .screen[hidden] {
      display: none;
    }

    .screen.is-exiting {
      opacity: 0;
      transform: translateY(-8px);
    }

    .screen.is-entering {
      opacity: 0;
      transform: translateY(10px);
    }

    .primary-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 64px;
      padding: 18px 24px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      background: var(--accent);
      color: var(--white);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .primary-button:active {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .primary-button:focus-visible,
    .option:focus-visible,
    .back-button:focus-visible {
      outline: 3px solid rgba(118, 84, 90, 0.25);
      outline-offset: 3px;
    }

    /* Intro */
    .intro-screen {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        max(34px, env(safe-area-inset-top))
        30px
        max(30px, env(safe-area-inset-bottom));
    }

    .intro-copy {
      margin: auto 0;
      padding: 64px 0 52px;
    }

    .intro-title {
      max-width: 390px;
      margin: 0;
      font-family: inherit;
      font-size: clamp(2.5rem, 11vw, 3.5rem);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.045em;
    }

    .intro-description {
      max-width: 380px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.85;
      letter-spacing: -0.025em;
    }

    .intro-footer {
      display: grid;
      gap: 18px;
    }

    .time-hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-align: center;
    }

    /* Questions */
    .question-screen {
      padding:
        max(20px, env(safe-area-inset-top))
        28px
        max(28px, env(safe-area-inset-bottom));
    }

    .question-header {
      position: relative;
      z-index: 2;
    }

    .question-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 54px;
      min-height: 48px;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font-size: 0.88rem;
      cursor: pointer;
    }

    .back-arrow {
      width: 8px;
      height: 8px;
      border-bottom: 1px solid currentColor;
      border-left: 1px solid currentColor;
      transform: rotate(45deg);
    }

    .progress-count {
      min-width: 48px;
      margin: 0;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.86rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      text-align: right;
    }

    .progress-count strong {
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 500;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      margin-top: 12px;
      overflow: hidden;
      background: var(--line);
    }

    .progress-fill {
      width: 16.666%;
      height: 100%;
      background: var(--accent);
      transform-origin: left center;
      transition: width 360ms var(--ease);
    }

    .question-body {
      padding-top: clamp(48px, 9vh, 84px);
      opacity: 1;
      transform: translateX(0);
      transition: opacity 150ms ease, transform 180ms var(--ease);
    }

    .question-body.is-leaving-next {
      opacity: 0;
      transform: translateX(-18px);
    }

    .question-body.is-leaving-prev {
      opacity: 0;
      transform: translateX(18px);
    }

    .question-body.is-entering-next {
      opacity: 0;
      transform: translateX(18px);
    }

    .question-body.is-entering-prev {
      opacity: 0;
      transform: translateX(-18px);
    }

    .question-title {
      min-height: 72px;
      margin: 0;
      font-size: clamp(1.55rem, 8vw, 2.5rem);
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: -0.045em;
      white-space: pre-line;
    }

    .options {
      display: grid;
      gap: 0;
      margin-top: clamp(38px, 7vh, 60px);
      border-top: 1px solid var(--line);
    }

    .option {
      position: relative;
      display: grid;
      grid-template-columns: 40px 1fr;
      align-items: center;
      width: 100%;
      min-height: 92px;
      padding: 24px 8px;
      overflow: hidden;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition:
        border-color 130ms ease,
        background 130ms ease,
        color 130ms ease;
    }

    .option:active {
      background: rgba(118, 84, 90, 0.06);
    }

    .option.is-selected {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--white);
    }

    .option.was-selected:not(.is-selected) {
      border-color: rgba(118, 84, 90, 0.55);
      background: rgba(118, 84, 90, 0.07);
    }

    .option-letter {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .option-text {
      display: block;
      font-size: clamp(1rem, 4vw, 1.12rem);
      font-weight: 550;
      line-height: 1.65;
      letter-spacing: -0.025em;
    }

    /* Result */
    .result-screen {
      padding:
        max(32px, env(safe-area-inset-top))
        28px
        max(30px, env(safe-area-inset-bottom));
    }

    .result-intro {
      padding: 15px 4px 15px;
      text-align: center;
    }

    .result-type {
      margin: 0;
      font-family: inherit;
      font-size: clamp(2.1rem, 9vw, 2.7rem);
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .result-definition {
      max-width: 340px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.8;
      letter-spacing: -0.035em;
      white-space: pre-line;
    }

    .result-card {
      padding: 20px 28px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--card);
    }

    .card-heading {
      margin: 0 0 22px;
      color: var(--ink);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .feature-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .feature-list li {
      position: relative;
      padding-left: 20px;
      font-size: 1rem;
      line-height: 1.7;
      letter-spacing: -0.03em;
    }

    .feature-list li::before {
      position: absolute;
      top: 0.62em;
      left: 0;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    .keyword-block {
      margin-top: 15px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .keyword-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .result-keywords {
      margin: 0;
      color: var(--accent-dark);
      font-family: inherit;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: -0.025em;
    }

    .cta-area {
      padding: 15px 3px 0;
    }

    .save-button {
      margin-bottom: 12px;
      border-color: var(--accent);
      background: transparent;
      color: var(--accent-dark);
    }

    .save-button:active {
      background: rgba(118, 84, 90, 0.08);
    }

    .save-button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .bridge-copy {
      max-width: 350px;
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      letter-spacing: -0.035em;
      text-align: center;
      white-space: pre-line;
    }

    .result-note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: -0.01em;
      text-align: center;
    }

    @media (min-width: 600px) {
      body {
        align-items: center;
        padding: 24px;
      }

      .app {
        min-height: min(820px, calc(100vh - 48px));
        height: min(820px, calc(100vh - 48px));
        border: 1px solid rgba(37, 35, 31, 0.08);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
    }

    @media (max-height: 700px) {
      .question-body {
        padding-top: 32px;
      }

      .options {
        margin-top: 28px;
      }

      .option {
        min-height: 76px;
        padding-top: 18px;
        padding-bottom: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app" id="app">
    <section class="screen intro-screen" id="intro-screen" aria-labelledby="intro-title">
      <div class="intro-copy">
        <h1 class="intro-title" id="intro-title">나의 럭셔리<br>취향 DNA 테스트</h1>
        <p class="intro-description">6개의 질문에 답하고<br>내가 자주 고르는 취향의 기준을 확인해보세요</p>
      </div>

      <div class="intro-footer">
        <button class="primary-button" id="btn_test_start" type="button">테스트 시작하기</button>
        <p class="time-hint">약 1분 소요 · 총 6문항</p>
      </div>
    </section>

    <section class="screen question-screen" id="question-screen" aria-labelledby="question-title" hidden>
      <header class="question-header">
        <div class="question-nav">
          <button class="back-button" id="back-button" type="button" aria-label="이전 문항으로 돌아가기">
            <span class="back-arrow" aria-hidden="true"></span>
            <span>이전</span>
          </button>
          <p class="progress-count" aria-live="polite">
            <strong id="current-count">1</strong> / 6
          </p>
        </div>
        <div class="progress-track" role="progressbar" aria-label="테스트 진행률" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </header>

      <div class="question-body" id="question-body">
        <h1 class="question-title" id="question-title"></h1>
        <div class="options" id="options" role="group" aria-labelledby="question-title"></div>
      </div>
    </section>

    <section class="screen result-screen" id="result-screen" aria-labelledby="result-type" hidden>
      <div id="result-capture">
        <div class="result-intro">
          <h2 class="result-type" id="result-type"></h2>
          <p class="result-definition" id="result-definition"></p>
        </div>

        <article class="result-card">
          <h3 class="card-heading">이런 취향을 가졌어요</h3>
          <ul class="feature-list" id="feature-list"></ul>
          <div class="keyword-block">
            <span class="keyword-label">어울리는 키워드</span>
            <p class="result-keywords" id="result-keywords"></p>
          </div>
        </article>
      </div>

      <div class="cta-area">
        <p class="bridge-copy" id="bridge-copy"></p>
        <a class="primary-button" id="btn_cta" href="https://chicment.com/">내 취향에 맞는 후기 더 보기</a>
        <button class="primary-button save-button" id="btn_save_image" type="button">결과 이미지 저장하기</button>

      </div>
    </section>
  </main>

        }
      };

      var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var currentQuestion = 0;
      var answers = [];
      var transitioning = false;

      /**
       * 최다 선택 유형을 반환합니다.
       * 동점이면 답변을 마지막 문항부터 역순으로 확인해
       * 가장 나중에 선택된 동점 유형을 우선합니다.
       * @param {string[]} answerList
       * @returns {string}
       */
      function calculateResult(answerList) {
        var scores = { A: 0, B: 0, C: 0, D: 0 };

        answerList.forEach(function (answer) {
          if (Object.prototype.hasOwnProperty.call(scores, answer)) {
            scores[answer] += 1;
          }
        });

        var highestScore = Math.max(scores.A, scores.B, scores.C, scores.D);
        var tiedTypes = TYPES.filter(function (type) {
          return scores[type] === highestScore;
        });

        for (var index = answerList.length - 1; index >= 0; index -= 1) {
          if (tiedTypes.indexOf(answerList[index]) !== -1) {
            return answerList[index];
          }
        }

        return "A";
      }

      function switchScreen(fromScreen, toScreen, onShown) {
        $(fromScreen).addClass("is-exiting");

        window.setTimeout(function () {
          $(fromScreen).prop("hidden", true).removeClass("is-exiting");
          $(toScreen).prop("hidden", false).scrollTop(0).addClass("is-entering");

          if (typeof onShown === "function") {
            onShown();
          }

          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              $(toScreen).removeClass("is-entering");
            });
          });
        }, reducedMotion ? 20 : 180);
      }

      function updateProgress() {
        var number = currentQuestion + 1;
        $("#current-count").text(number);
        $("#progress-fill").css("width", ((number / questions.length) * 100) + "%");
        $(".progress-track").attr("aria-valuenow", number);
      }

      function renderQuestion() {
        var item = questions[currentQuestion];
        $("#question-title").text(item.question);
        $("#options").empty();

        TYPES.forEach(function (type) {
          var $button = $("<button>", {
            type: "button",
            class: "option" + (answers[currentQuestion] === type ? " was-selected" : ""),
            "data-type": type,
            "aria-label": type + ". " + item.options[type]
          });

          $button.append(
            $("<span>", { class: "option-letter", text: type, "aria-hidden": "true" }),
            $("<span>", { class: "option-text", text: item.options[type] })
          );

          $("#options").append($button);
        });

        updateProgress();
      }

      function moveToQuestion(nextIndex, direction) {
        var leavingClass = direction === "prev" ? "is-leaving-prev" : "is-leaving-next";
        var enteringClass = direction === "prev" ? "is-entering-prev" : "is-entering-next";

        transitioning = true;
        $("#question-body").addClass(leavingClass);

        window.setTimeout(function () {
          currentQuestion = nextIndex;
          renderQuestion();
          $("#question-body").removeClass(leavingClass).addClass(enteringClass);

          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              $("#question-body").removeClass(enteringClass);
              window.setTimeout(function () {
                transitioning = false;
              }, reducedMotion ? 10 : 170);
            });
          });
        }, reducedMotion ? 20 : 160);
      }

      function renderResult(type) {
        var result = results[type];
        $("#result-type").text(result.name);
        $("#result-definition").text(result.definition);
        $("#result-keywords").text(result.keywords);
        $("#bridge-copy").text(result.bridge);
        $("#result-screen").attr("data-result", type);
        $("#feature-list").html(result.features.map(function (feature) {
          return "<li>" + feature + "</li>";
        }).join(""));
      }

      function showResult() {
        var type = calculateResult(answers);
        renderResult(type);
        switchScreen("#question-screen", "#result-screen", function () {
          transitioning = false;
          $("#result-screen").attr("tabindex", "-1").trigger("focus");
        });
      }

      function saveResultImage() {
        var $button = $("#btn_save_image");
        var fileName = $("#result-type").text() + "-결과.png";

        $button.prop("disabled", true).text("이미지 만드는 중");

        html2canvas($("#result-capture")[0], {
          scale: 2,
          backgroundColor: "#f3f0ea",
          useCORS: true
        }).then(function (canvas) {
          return new Promise(function (resolve, reject) {
            canvas.toBlob(function (blob) {
              if (!blob) {
                reject(new Error("이미지 생성에 실패했습니다."));
                return;
              }

              var imageUrl = URL.createObjectURL(blob);
              var $download = $("<a>", {
                href: imageUrl,
                download: fileName
              }).appendTo("body");

              $download[0].click();
              $download.remove();

              window.setTimeout(function () {
                URL.revokeObjectURL(imageUrl);
              }, 1000);

              resolve();
            }, "image/png");
          });
        }).catch(function () {
          alert("이미지를 저장하지 못했습니다. 다시 시도해주세요.");
        }).finally(function () {
          $button.prop("disabled", false).text("결과 이미지 저장하기");
        });
      }

      function selectAnswer(event) {
        if (transitioning) {
          return;
        }

        transitioning = true;
        var $selectedButton = $(event.currentTarget);
        var selectedType = $selectedButton.data("type");
        $("#options .option").prop("disabled", true).removeClass("is-selected was-selected");

        $selectedButton.addClass("is-selected");
        answers[currentQuestion] = selectedType;

        window.setTimeout(function () {
          if (currentQuestion === questions.length - 1) {
            showResult();
          } else {
            moveToQuestion(currentQuestion + 1, "next");
          }
        }, reducedMotion ? 50 : 240);
      }

      $("#btn_test_start").on("click", function () {
        if (transitioning) {
          return;
        }
        transitioning = true;
        currentQuestion = 0;
        answers = [];
        renderQuestion();
        switchScreen("#intro-screen", "#question-screen", function () {
          transitioning = false;
        });
      });

      $("#back-button").on("click", function () {
        if (transitioning) {
          return;
        }

        if (currentQuestion === 0) {
          transitioning = true;
          switchScreen("#question-screen", "#intro-screen", function () {
            transitioning = false;
          });
          return;
        }

        moveToQuestion(currentQuestion - 1, "prev");
      });

      $("#options").on("click", ".option", selectAnswer);
      $("#btn_save_image").on("click", saveResultImage);

      /* 분석 도구 연동 시 전역 함수로도 테스트할 수 있도록 노출합니다. */
      window.calculateResult = calculateResult;
    });
  </script>
</body>
</html>
